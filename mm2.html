<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Impression size calculator</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --card: #ffffff;
        --ink: #14213d;
        --muted: #5b6678;
        --line: #c9d1dc;
        --accent: #0f766e;
        --accent-bg: #d9f0ec;
        --err: #b42318;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10161f;
          --card: #19212d;
          --ink: #e8edf4;
          --muted: #9aa6b8;
          --line: #334155;
          --accent: #5eead4;
          --accent-bg: #123b38;
          --err: #fda29b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          Arial,
          sans-serif;
        line-height: 1.5;
      }
      nav {
        background: var(--card);
        border-bottom: 1px solid var(--line);
        padding: 10px 16px;
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .navin {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .brand {
        font-weight: 700;
        margin-right: auto;
      }
      .navbtn {
        margin: 0;
        padding: 8px 18px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .navbtn[aria-current="page"] {
        color: var(--bg);
        background: var(--ink);
        border-color: var(--ink);
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      .page[hidden] {
        display: none;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 4px;
      }
      p.sub {
        margin: 0 0 20px;
        color: var(--muted);
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px;
      }
      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        font-size: 1rem;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      input:focus,
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 1px;
      }
      button.go {
        margin-top: 14px;
        padding: 10px 20px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        color: var(--bg);
        background: var(--ink);
        border: 0;
        border-radius: 6px;
      }
      .error {
        color: var(--err);
        margin: 10px 0 0;
        min-height: 1.4em;
      }
      .summary {
        margin: 22px 0 10px;
        font-weight: 600;
      }
      .result {
        margin-bottom: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        align-items: center;
      }
      .result h2 {
        margin: 0 0 8px;
        font-size: 1.15rem;
      }
      dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      dd small {
        font-weight: 400;
        color: var(--muted);
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .sheet {
        fill: var(--bg);
        stroke: var(--ink);
        stroke-width: 1.5;
      }
      .cell {
        fill: var(--accent-bg);
        stroke: var(--accent);
        stroke-width: 1;
      }
      .cap {
        font-size: 11px;
        fill: var(--muted);
        text-anchor: middle;
      }
      .rule {
        margin-top: 20px;
        font-size: 0.9rem;
        color: var(--muted);
      }
      @media (max-width: 560px) {
        .fields,
        .result {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <nav aria-label="Machine selection">
      <div class="navin">
        <span class="brand">Impression calculator</span>
        <button class="navbtn" type="button" data-page="sm52">SM52</button>
        <button class="navbtn" type="button" data-page="gto">GTO</button>
      </div>
    </nav>

    <main>
      <section class="page" id="page-sm52"></section>
      <section class="page" id="page-gto" hidden></section>
    </main>

    <script>
      // Layouts tried (i along length, j along width)
      const PAIRS = [
        [2, 2],
        [2, 3],
        [3, 2],
        [4, 2],
        [2, 4],
        [3, 3],
        [2, 5],
        [5, 2],
        [2, 6],
        [6, 2],
        [3, 4],
        [4, 3],
      ];

      // Machine rules
      const MACHINES = {
        sm52: { name: "SM52", lMin: 145, lMax: 520, wMin: 105, wMax: 373 },
        gto: { name: "GTO", lMin: 145, lMax: 505, wMin: 205, wMax: 340 },
      };

      const fmt = (x) => (Number.isInteger(x) ? String(x) : x.toFixed(2));

      function drawSheet(m, n, i, j) {
        const W = 300,
          H = Math.max(60, Math.min(260, (W * n) / m));
        const pad = 8,
          w = W - pad * 2,
          h = H - pad * 2;
        let cells = "";
        for (let a = 0; a < i; a++) {
          for (let b = 0; b < j; b++) {
            cells += `<rect class="cell" x="${pad + (a * w) / i}" y="${pad + (b * h) / j}" width="${w / i}" height="${h / j}"/>`;
          }
        }
        return `<svg viewBox="0 0 ${W} ${H + 16}" role="img" aria-label="Sheet divided into ${i} by ${j} impressions">
      <rect class="sheet" x="${pad}" y="${pad}" width="${w}" height="${h}"/>${cells}
      <text class="cap" x="${W / 2}" y="${H + 12}">${i} along length x ${j} along width</text></svg>`;
      }

      function buildPage(key) {
        const c = MACHINES[key];
        const root = document.getElementById("page-" + key);
        const pairsText = PAIRS.map(([i, j]) => `(${i},${j})`).join(" ");

        root.innerHTML = `
          <h1>${c.name} impression size calculator</h1>
          <p class="sub">Enter the full sheet size to see which layouts give an allowed impression size for the ${c.name} machine.</p>
          <section class="panel">
            <div class="fields">
              <div>
                <label for="${key}-m">Sheet length (mm)</label>
                <input id="${key}-m" type="number" min="1" step="any" inputmode="decimal" placeholder="e.g. 500" />
              </div>
              <div>
                <label for="${key}-n">Sheet width (mm)</label>
                <input id="${key}-n" type="number" min="1" step="any" inputmode="decimal" placeholder="e.g. 300" />
              </div>
            </div>
            <button class="go" type="button">Find layouts</button>
            <p class="error" role="alert"></p>
          </section>
          <div class="out" aria-live="polite"></div>
          <p class="rule">
            ${c.name} rules: impression length (m/i) must be ${c.lMin} to ${c.lMax}, and impression width (n/j) must be ${c.wMin} to ${c.wMax}.
            Layouts tried (i, j): ${pairsText}.
          </p>`;

        const mEl = root.querySelector(`#${key}-m`);
        const nEl = root.querySelector(`#${key}-n`);
        const err = root.querySelector(".error");
        const out = root.querySelector(".out");

        function calculate() {
          const m = parseFloat(mEl.value),
            n = parseFloat(nEl.value);
          err.textContent = "";
          out.innerHTML = "";

          if (!(m > 0) || !(n > 0)) {
            err.textContent =
              "Enter a sheet length and a sheet width greater than 0.";
            return;
          }

          const found = PAIRS.map(([i, j]) => ({
            i,
            j,
            len: m / i,
            wid: n / j,
          })).filter(
            (p) =>
              p.len >= c.lMin &&
              p.len <= c.lMax &&
              p.wid >= c.wMin &&
              p.wid <= c.wMax,
          );

          if (!found.length) {
            out.innerHTML = `<p class="summary">No layout works for a ${fmt(m)} x ${fmt(n)} sheet on the ${c.name}.</p>
              <p>Try a different sheet length or width. Each impression must be ${c.lMin} to ${c.lMax} long and ${c.wMin} to ${c.wMax} wide.</p>`;
            return;
          }

          out.innerHTML =
            `<p class="summary">${c.name} - Sheet ${fmt(m)} x ${fmt(n)}: ${found.length} layout${found.length > 1 ? "s" : ""} found.</p>` +
            found
              .map(
                (p) => `
            <section class="panel result">
              <div>
                <h2>i = ${p.i}, j = ${p.j}</h2>
                <dl>
                  <dt>Impression length</dt>
                  <dd>${fmt(p.len)} <small>(m/i = ${fmt(m)}/${p.i})</small></dd>
                  <dt>Impression width</dt>
                  <dd>${fmt(p.wid)} <small>(n/j = ${fmt(n)}/${p.j})</small></dd>
                  <dt>Impressions per sheet</dt>
                  <dd>${p.i * p.j}</dd>
                </dl>
              </div>
              ${drawSheet(m, n, p.i, p.j)}
            </section>`,
              )
              .join("");
        }

        root.querySelector(".go").addEventListener("click", calculate);
        [mEl, nEl].forEach((el) =>
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter") calculate();
          }),
        );
      }

      // Navigation
      const buttons = document.querySelectorAll(".navbtn");

      function show(key) {
        if (!MACHINES[key]) key = "sm52";
        Object.keys(MACHINES).forEach((k) => {
          document.getElementById("page-" + k).hidden = k !== key;
        });
        buttons.forEach((b) => {
          if (b.dataset.page === key) b.setAttribute("aria-current", "page");
          else b.removeAttribute("aria-current");
        });
        document.title = MACHINES[key].name + " - Impression size calculator";
      }

      buttons.forEach((b) =>
        b.addEventListener("click", () => {
          location.hash = b.dataset.page;
        }),
      );
      window.addEventListener("hashchange", () => show(location.hash.slice(1)));

      Object.keys(MACHINES).forEach(buildPage);
      show(location.hash.slice(1));
    </script>
  </body>
</html>
